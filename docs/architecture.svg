<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
    <rect width="900" height="520" fill="#ffffff"/>
    <!-- Title -->
    <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">CRM MVP - Architecture</text>
    <!-- Browser -->
    <rect x="360" y="60" width="180" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="450" y="93" text-anchor="middle" font-size="14" fill="#3730a3">Browser (User)</text>
    <!-- Arrow: Browser -> Frontend -->
    <line x1="450" y1="116" x2="450" y2="150" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- Frontend -->
    <rect x="300" y="150" width="300" height="64" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="450" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">Frontend</text>
    <text x="450" y="197" text-anchor="middle" font-size="12" fill="#065f46">React + Vite, served via Nginx (Render Static Site)</text>
    <!-- Arrow: Frontend -> API -->
    <line x1="450" y1="214" x2="450" y2="248" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="470" y="235" font-size="11" fill="#6b7280">REST (HTTPS + JWT)</text>
    <!-- API -->
    <rect x="300" y="248" width="300" height="72" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="450" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">API</text>
    <text x="450" y="297" text-anchor="middle" font-size="12" fill="#1e3a8a">NestJS + Drizzle ORM (Render Web Service, Docker)</text>
    <text x="450" y="312" text-anchor="middle" font-size="11" fill="#3b82f6">Auth · CRM CRUD · RAG endpoints</text>
    <!-- Arrow: API -> Postgres -->
    <line x1="450" y1="320" x2="450" y2="354" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- Postgres -->
    <rect x="300" y="354" width="300" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="450" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">PostgreSQL + pgvector</text>
    <text x="450" y="403" text-anchor="middle" font-size="12" fill="#78350f">CRM tables · activity_chunks (embeddings)</text>
    <text x="450" y="418" text-anchor="middle" font-size="11" fill="#92400e">Render Managed Postgres</text>
    <!-- Side: Voyage -->
    <line x1="600" y1="270" x2="680" y2="270" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="680" y="220" width="180" height="60" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <text x="770" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">Voyage AI</text>
    <text x="770" y="264" text-anchor="middle" font-size="11" fill="#9d174d">Embeddings (voyage-4-lite)</text>
    <!-- Side: Gemini -->
    <line x1="600" y1="300" x2="680" y2="300" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="680" y="290" width="180" height="60" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="770" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">Google Gemini</text>
    <text x="770" y="334" text-anchor="middle" font-size="11" fill="#5b21b6">Generation (gemini-flash-latest)</text>
    <!-- Legend / flow note -->
    <rect x="5" y="450" width="900" height="50" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="450" y="470" text-anchor="middle" font-size="12" fill="#4b5563">RAG flow: user question → embedded via Voyage → cosine similarity search in pgvector → top matches + question sent to Gemini → grounded answer with citations</text>
    <text x="450" y="488" text-anchor="middle" font-size="11" fill="#9ca3af">Two independent providers, chosen for free-tier availability at MVP scale - not a hard dependency on either</text>
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
        </marker>
    </defs>
</svg>